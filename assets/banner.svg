<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" role="img" aria-label="Harris, student and tech enthusiast, in the quest of finding cool tech stuffs. A cute robot sweeps a magnifying glass over floating gadgets.">
  <defs>
    <linearGradient id="hq-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3aa8"/>
      <stop offset="0.55" stop-color="#a24bb8"/>
      <stop offset="1" stop-color="#ee7fb0"/>
    </linearGradient>
    <radialGradient id="hq-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd1ea" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd1ea" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .hq-spark { fill: #fff; transform-box: fill-box; transform-origin: center; animation: hq-twinkle 2.6s ease-in-out infinite; }
    .hq-a { animation-delay: -0.7s; } .hq-b { animation-delay: -1.4s; } .hq-c { animation-delay: -2s; }
    @keyframes hq-twinkle { 0%, 100% { transform: scale(0.3) rotate(0deg); opacity: 0.25; } 50% { transform: scale(1.1) rotate(45deg); opacity: 1; } }

    .hq-halo { transform-box: fill-box; transform-origin: center; animation: hq-pulse 4s ease-in-out infinite alternate; }
    @keyframes hq-pulse { from { transform: scale(0.92); opacity: 0.7; } to { transform: scale(1.08); opacity: 1; } }

    .hq-bot { animation: hq-bob 2s ease-in-out infinite alternate; }
    @keyframes hq-bob { from { transform: translateY(0); } to { transform: translateY(-9px); } }

    .hq-eyes { transform-box: fill-box; transform-origin: center; animation: hq-blink 4.5s infinite; }
    @keyframes hq-blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.1); } }

    .hq-led { transform-box: fill-box; transform-origin: center; animation: hq-led 1.2s ease-in-out infinite; }
    @keyframes hq-led { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }

    .hq-flame { transform-box: fill-box; transform-origin: 50% 0%; animation: hq-flame 0.35s ease-in-out infinite alternate; }
    @keyframes hq-flame { from { transform: scaleY(0.7); } to { transform: scaleY(1.25); } }

    .hq-sweep { transform-origin: 678px 172px; animation: hq-sweep 3.2s ease-in-out infinite alternate; }
    @keyframes hq-sweep { from { transform: rotate(-12deg); } to { transform: rotate(10deg); } }

    .hq-float { animation: hq-float 3s ease-in-out infinite alternate; }
    .hq-f2 { animation-duration: 3.8s; animation-delay: -1s; } .hq-f3 { animation-duration: 3.4s; animation-delay: -2s; } .hq-f4 { animation-duration: 4.2s; animation-delay: -0.5s; }
    @keyframes hq-float { from { transform: translateY(0); } to { transform: translateY(-12px); } }

    .hq-gear { transform-box: fill-box; transform-origin: center; animation: hq-spin 8s linear infinite; }
    @keyframes hq-spin { to { transform: rotate(360deg); } }

    .hq-wifi { opacity: 0.2; animation: hq-wifi 2s ease-in-out infinite; }
    .hq-w2 { animation-delay: 0.3s; } .hq-w3 { animation-delay: 0.6s; }
    @keyframes hq-wifi { 0%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    .hq-trace { stroke-dasharray: 12 48; animation: hq-run 2.4s linear infinite; }
    @keyframes hq-run { to { stroke-dashoffset: -60; } }

    @media (prefers-reduced-motion: reduce) {
      .hq-spark, .hq-halo, .hq-bot, .hq-eyes, .hq-led, .hq-flame, .hq-sweep, .hq-float, .hq-gear, .hq-wifi { animation: none; }
      .hq-spark, .hq-wifi { opacity: 0.9; }
      .hq-trace { animation: none; }
    }
  </style>

  <rect width="800" height="240" rx="24" fill="url(#hq-bg)"/>

